apiVersion: operator.kcp.io/v1alpha1
kind: RootShard
metadata:
  name: root
spec:
  image:
    # There's a bug that the IP of the pod and the default 6443 port is
    # used as the VW base url. This doesn't work with kcp running in
    # a kube cluster, which uses :6443 itself. This is fixed in main but
    # not in the release version kcp-operator deploys.
    tag: 8dae1f51e
  # Setting the shardBaseURL here only works because this is
  # a single-shard setup. In multi-shard setups, each shard would
  # need to have its own correct URL and be exposed through an ingress.
  # shardBaseURL: https://broker-platform-control-plane:443/rootshard
  external:
    hostname: broker-platform-control-plane
    port: 443
  certificates:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: selfsigned
  cache:
    embedded:
      enabled: true
  etcd:
    endpoints:
      - http://kcp-etcd-client.default.svc.cluster.local:2379
# ---
