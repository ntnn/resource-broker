apiVersion: operator.kcp.io/v1alpha1
kind: RootShard
metadata:
  name: root
spec:
  image:
    # There's a bug that the IP of the pod and the default 6443 port is
    # used as the VW base url. This doesn't work with kcp running in
    # a kube cluster, which uses :6443 itself. This is fixed in main but
    # not in the release version kcp-operator deploys.
    tag: 8dae1f51e
  # The shardBaseURL is the NodePort service exposing the root shard.
  # Required for other kind clusters to access the virtual workspaces.
  shardBaseURL: https://broker-platform-control-plane:32443
  external:
    hostname: broker-platform-control-plane
    port: 443
  certificates:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: selfsigned
  cache:
    embedded:
      enabled: true
  etcd:
    endpoints:
      - http://kcp-etcd-client.default.svc.cluster.local:2379
---
# Exposing the root shard via a NodePort service. In production
# systems this would be handled properly with a load balancer or
# ingress.
apiVersion: v1
kind: Service
metadata:
  name: root-kcp-nodeport
  namespace: default
spec:
  type: NodePort
  ports:
  - appProtocol: https
    name: https
    port: 6443
    protocol: TCP
    targetPort: 6443
    nodePort: 32443
  selector:
    app.kubernetes.io/component: rootshard
    app.kubernetes.io/instance: root
    app.kubernetes.io/managed-by: kcp-operator
    app.kubernetes.io/name: kcp
---
apiVersion: operator.kcp.io/v1alpha1
kind: FrontProxy
metadata:
  name: frontproxy
spec:
  rootShard:
    ref:
      name: root
  certificateTemplates:
    server:
      spec:
        dnsNames:
          - localhost
        ipAddresses:
          - 127.0.0.1
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kcp-proxy
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  tls:
    - hosts:
        - broker-platform-control-plane
      secretName: root-frontproxy-server
  rules:
    - host: broker-platform-control-plane
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontproxy-front-proxy
                port:
                  number: 6443
---
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: kubeconfig-kcp-admin
spec:
  username: kcp-admin
  groups:
    - system:kcp:admin
  validity: 8766h
  secretRef:
    name: admin-kubeconfig
  target:
    frontProxyRef:
      name: frontproxy
---
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: kubeconfig-kcp-operator
spec:
  username: kcp-admin
  groups:
    - system:kcp:admin
  validity: 8766h
  secretRef:
    name: operator-kubeconfig
  target:
    rootShardRef:
      name: root
