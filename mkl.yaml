statusStyle:
  absent: stroke:grey,stroke-width:4px
  pending: stroke:yellow,stroke-width:4px,fill:lightyellow
  healthy: stroke:green,stroke-width:4px,fill:lightgreen

nodes:

  # internalop:
  #   selector:
  #     cluster: ./kubeconfigs/internalca.kubeconfig+kind-broker-internalca
  #     gvr:
  #       version: v1
  #       resource: deployments
  #       group: apps
  #     namespace: default
  #     name: api-syncagent

  # internal kind
  internalcert:
    selector:
      cluster: ./kubeconfigs/internalca.kubeconfig+kind-broker-internalca
      gvr:
        version: v1alpha1
        resource: certificates
        group: example.platform-mesh.io
      labelSelector:
        matchLabels:
          syncagent.kcp.io/agent-name: internalca
    label: '"Consumer Cert\n fqdn: "+.rs.Resources[0].spec.fqdn'

  internalsecret:
    selector:
      cluster: ./kubeconfigs/internalca.kubeconfig+kind-broker-internalca
      gvr:
        version: v1
        resource: secrets
      labelSelector:
        matchLabels:
          kro.run/resource-graph-definition-name: certificates.example.platform-mesh.io
    label: '"Consumer Secret\n subject: "+parseCert(.rs.Resources[0].data["tls.crt"]).Subject.CommonName'

  # external kind
  externalcert:
    selector:
      cluster: ./kubeconfigs/externalca.kubeconfig+kind-broker-externalca
      gvr:
        version: v1alpha1
        resource: certificates
        group: example.platform-mesh.io
      labelSelector:
        matchLabels:
          syncagent.kcp.io/agent-name: externalca
    label: '"Consumer Cert\n fqdn: "+.rs.Resources[0].spec.fqdn'

  externalsecret:
    selector:
      cluster: ./kubeconfigs/externalca.kubeconfig+kind-broker-externalca
      gvr:
        version: v1
        resource: secrets
      labelSelector:
        matchLabels:
          kro.run/resource-graph-definition-name: certificates.example.platform-mesh.io
    label: '"Consumer Secret\n subject: "+parseCert(.rs.Resources[0].data["tls.crt"]).Subject.CommonName'

  # internal vw
  consumerCertInt:
    selector:
      cluster: ./kubeconfigs/workspaces/internalca.vw.kubeconfig+default
      gvr:
        version: v1alpha1
        resource: certificates
        group: example.platform-mesh.io
      name: cert-from-consumer
      namespace: default
    label: '"Consumer Cert\n fqdn: "+.rs.Resources[0].spec.fqdn'

  consumerSecretInt:
    selector:
      cluster: ./kubeconfigs/workspaces/internalca.vw.kubeconfig+default
      namespace: default
      gvr:
        version: v1
        resource: secrets
      labelSelector:
        matchLabels:
          kro.run/resource-graph-definition-name: certificates.example.platform-mesh.io
    label: '"Consumer Secret\n subject: "+parseCert(.rs.Resources[0].data["tls.crt"]).Subject.CommonName'

  # external vw
  consumerCertExt:
    selector:
      cluster: ./kubeconfigs/workspaces/externalca.vw.kubeconfig+default
      gvr:
        version: v1alpha1
        resource: certificates
        group: example.platform-mesh.io
      name: cert-from-consumer
      namespace: default
    label: '"Consumer Cert\n fqdn: "+.rs.Resources[0].spec.fqdn'

  consumerSecretExt:
    selector:
      cluster: ./kubeconfigs/workspaces/externalca.vw.kubeconfig+default
      namespace: default
      gvr:
        version: v1
        resource: secrets
      labelSelector:
        matchLabels:
          kro.run/resource-graph-definition-name: certificates.example.platform-mesh.io
    label: '"Consumer Secret\n subject: "+parseCert(.rs.Resources[0].data["tls.crt"]).Subject.CommonName'

  # consumer vw
  consumerCertVW:
    selector:
      cluster: ./kubeconfigs/workspaces/consumer.vw.kubeconfig+workspace.kcp.io/current
      gvr:
        version: v1alpha1
        resource: certificates
        group: example.platform-mesh.io
      name: cert-from-consumer
      namespace: default
    label: '"Consumer Cert\n fqdn: "+.rs.Resources[0].spec.fqdn'

  consumerSecretVW:
    selector:
      cluster: ./kubeconfigs/workspaces/consumer.vw.kubeconfig+workspace.kcp.io/current
      namespace: default
      gvr:
        version: v1
        resource: secrets
      owner:
        gvr:
          version: v1alpha1
          resource: certificates
          group: example.platform-mesh.io
        name: cert-from-consumer
    label: '"Consumer Secret\n subject: "+parseCert(.rs.Resources[0].data["tls.crt"]).Subject.CommonName'

  # consumer
  consumerCert:
    selector:
      cluster: ./kubeconfigs/workspaces/consumer.kubeconfig+workspace.kcp.io/current
      gvr:
        version: v1alpha1
        resource: certificates
        group: example.platform-mesh.io
      name: cert-from-consumer
      namespace: default
    label: '"Consumer Cert\n fqdn: "+.rs.Resources[0].spec.fqdn'

  consumerSecret:
    selector:
      cluster: ./kubeconfigs/workspaces/consumer.kubeconfig+workspace.kcp.io/current
      namespace: default
      gvr:
        version: v1
        resource: secrets
    label: '"Consumer Secret\n subject: "+parseCert(.rs.Resources[0].data["tls.crt"]).Subject.CommonName'
